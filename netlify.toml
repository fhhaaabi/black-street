

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Envoi des commandes (fonction Netlify → Telegram)
[[redirects]]
  from = "/api/order"
  to = "/.netlify/functions/order"
  status = 200

# Vue Router (mode historique) : toutes les autres URL renvoient vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200